<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>مرجع مهندس الموقع</title>
<meta name="theme-color" content="#f7f4ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مهندس الموقع">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260918-3">
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="topbar-row">
      <button class="icon-btn" id="themeToggle" title="الوضع الليلي">🌙</button>
      <button class="nav-link" id="navInspectionsBtn">🧱 استلام التسليح</button>
      <button class="nav-link" id="navCategoriesBtn">📂 الأقسام</button>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text" placeholder="ابحث في المرجع...">
      <span class="search-icon">🔎</span>
      <button class="search-clear" id="searchClear">✕</button>
    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
  </div>

  <div class="content" id="content"></div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <img id="lightboxImg" src="" alt="">
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-sheet" id="confirmSheet"></div>
  </div>

  <div class="sync-toast" id="syncToast"></div>

</div>

<script src="categories.js?v=20260918-1"></script>
<script src="entries.js?v=20260918-1"></script>
<script src="inspections.js?v=20260918-1"></script>
<script src="local-data.js?v=20260918-2"></script>
<script src="inspection-app.js?v=20260918-3"></script>
<script src="app.js?v=20260918-3"></script>
</body>
</html>
